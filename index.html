<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMS World Academy — منصة التعلم الرقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1B3A6B;--red:#8B1A1A;--teal:#0D6E6E;--gold:#C9963A;--goldL:#F2B705;
  --navy:#0B2545;--lb:#EBF2FF;--lr:#FFF0F0;--lt:#E0F5F0;--bg:#F4F6FB;
  --border:#DDE6F5;--sh:0 2px 16px rgba(27,58,107,0.10);
}
body{background:var(--bg);min-height:100vh;font-family:'Tajawal','Segoe UI',Arial,sans-serif;direction:rtl;color:#1a1a2e}
.h{display:none!important}
/* TOPBAR */
.tb{background:#fff;border-bottom:2px solid var(--border);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--sh)}
/* BUTTONS */
.b{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:9px;padding:7px 15px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .18s}
.bp{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff}.bp:hover{opacity:.9;transform:translateY(-1px)}
.bs{background:#fff;color:var(--blue);border:1.5px solid var(--border)}.bs:hover{background:var(--lb)}
.bd{background:var(--lr);color:var(--red);border:1.5px solid #fca5a5}
.bg{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff}
.bsm{padding:5px 10px;font-size:11px;border-radius:7px}
/* LAYOUT */
.sl{display:flex;min-height:calc(100vh - 58px)}
.sb{width:210px;background:#fff;border-left:2px solid var(--border);padding:14px 10px;flex-shrink:0}
.sm{flex:1;padding:24px;overflow-y:auto}
.sbb{width:100%;text-align:right;padding:10px 12px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:900;color:#666;display:flex;align-items:center;gap:9px;margin-bottom:3px;font-family:inherit;transition:all .18s}
.sbb:hover,.sbb.act{background:var(--lb);color:var(--blue)}
.sbb .en{font-size:9px;font-weight:700;color:var(--red);display:block;line-height:1.1;margin-top:1px}
/* CARDS */
.card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.csm{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
/* TEXT */
.ar{font-weight:900;color:var(--blue)} .en{font-weight:700;color:var(--red)}
.ins{background:linear-gradient(135deg,var(--lb),var(--lr));border:1px solid var(--border);border-radius:12px;padding:11px 15px;margin-bottom:16px}
.ins .ar{font-size:13px} .ins .en{font-size:11px}
/* FORMS */
.fl{margin-bottom:12px}
.fl label .a{font-size:11px;font-weight:900;color:var(--blue);display:block;margin-bottom:3px}
.fl label .e{font-size:10px;font-weight:700;color:var(--red);display:block;margin-bottom:4px}
input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--blue);background:#fff;outline:none;transition:border-color .2s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[dir=ltr]{direction:ltr;text-align:left} textarea{resize:vertical;min-height:80px}
/* STAT */
.sc{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px;text-align:center}
.sv{font-size:34px;font-weight:900;line-height:1}
/* GRID BTNS */
.gbtn{padding:14px 8px;border-radius:12px;border:1.5px solid var(--border);background:#fff;cursor:pointer;text-align:center;font-size:12px;font-weight:900;color:var(--blue);transition:all .2s;font-family:inherit}
.gbtn.act{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border-color:var(--blue)}
/* CODE */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--lb);color:var(--blue);border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-family:monospace;font-size:12px;font-weight:900;cursor:pointer}
.chip:hover{background:#d8e8ff}
/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:10px;font-size:12px;font-weight:900;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--blue);font-family:inherit;transition:all .2s}
.tab.act{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff}
/* ICON CARDS */
.sic{background:#fff;border:2px solid var(--border);border-radius:18px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .22s;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sic:hover{border-color:var(--blue);box-shadow:0 6px 24px rgba(27,58,107,0.14);transform:translateY(-3px)}
.gic{background:#fff;border:2px solid var(--border);border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer;transition:all .22s}
.gic:hover{border-color:var(--teal);transform:translateY(-2px)}
.tc{background:linear-gradient(135deg,var(--lb),#fff);border:2px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:all .2s;position:relative}
.tc:hover{border-color:var(--blue);box-shadow:0 4px 18px rgba(27,58,107,0.12)}
.uc{background:#fff;border:2px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s}
.uc:hover{border-color:var(--blue)} .uc.done{border-color:#22c55e;background:#f0fdf4}
/* ACT LIST */
.ai{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:2px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.ai:hover{border-color:var(--blue)} .ai.done{border-color:#22c55e;background:#f0fdf4}
.an{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.an.done{background:linear-gradient(135deg,#22c55e,#15803d)}
/* WHITE PAPER */
.wpw{background:#c8c8c0;min-height:100vh;padding:20px;overflow-y:auto}
.wp{background:#fff;width:100%;max-width:760px;margin:0 auto;padding:32px 36px;box-shadow:0 4px 24px rgba(0,0,0,.18);border-radius:2px}
.zbar{background:var(--navy);padding:8px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.zbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit}
.zbtn:hover{background:rgba(255,255,255,.25)}
/* VOCAB */
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:12px 0}
.vc{border:2px solid var(--border);border-radius:14px;overflow:hidden;text-align:center;background:#fff}
.vi{height:90px;background:var(--lb);display:flex;align-items:center;justify-content:center;font-size:44px;border-bottom:1.5px solid var(--border)}
.var{font-size:15px;font-weight:900;color:var(--blue);padding:7px 8px 3px}
.ven{font-size:12px;font-weight:700;color:var(--red);padding:0 8px 9px}
/* SENTENCE */
.scard{border:2px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px;background:#fff}
.sbody{padding:14px 16px}
.sar{font-size:18px;font-weight:900;color:var(--blue);line-height:1.7;margin-bottom:6px}
.sen{font-size:14px;font-weight:700;color:var(--red);direction:ltr;text-align:left}
/* MINDMAP */
.mmc{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-weight:900;font-size:13px;text-align:center;padding:10px}
.mmn{background:#fff;border:2px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;transition:all .2s}
.mmn:hover{border-color:var(--blue)} .mmn.rev{border-color:var(--teal);background:var(--lt)}
.mma{display:none;margin-top:6px;padding:6px;background:var(--lt);border-radius:7px;font-size:11px}
.mmn.rev .mma{display:block}
/* DIALOGUE */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.db{background:#fff;border:2px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px}
/* PROGRESS */
.pb{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:6px}
.pf{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;transition:width .6s}
/* CERT */
.certw{border:4px solid var(--goldL);border-radius:22px;padding:28px;background:linear-gradient(135deg,#fffef5,#fff8e1);text-align:center;position:relative;overflow:hidden;margin-bottom:20px}
.certi{border:2px solid #e8c96a;border-radius:16px;padding:22px}
/* GOAL */
.gf{background:linear-gradient(135deg,var(--lb),#fff);border:2px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
/* PAPER */
.ph{border-bottom:3px double var(--blue);padding-bottom:12px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.pf2{border-top:1px solid #ccc;margin-top:16px;padding-top:8px;display:flex;justify-content:space-between;font-size:10px;color:#999}
.pgb{page-break-before:always;margin-top:32px;padding-top:24px;border-top:3px dashed #e2e8f0}
/* REPORT BADGES */
.ba{background:#dcfce7;color:#166534;border:1.5px solid #86efac;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:900}
.bi2{background:#fef9c3;color:#854d0e;border:1.5px solid #fcd34d;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:900}
.bb{background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:900}
/* CEFR */
.cb{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-weight:900;font-size:13px;color:var(--blue);font-family:inherit;transition:all .2s}
.cb.act{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff}
/* SUBMIT */
.subbig{width:100%;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:18px}
.subbig:hover{opacity:.9}
/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 22px;border-radius:12px;font-weight:900;font-size:13px;z-index:9999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.2)}
@media print{.np{display:none!important}.wp{box-shadow:none}.pgb{page-break-before:always}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="modal" class="mo h"><div id="mb" class="mb"></div></div>
<div id="app"></div>
<script>

let me=null, loginRole=null, pendCreds=null, pendCode=null;

// HELPERS

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const genCode=p=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[~~(Math.random()*c.length)];return p+'-'+s};
const genCreds=function(n){
  // Username: first name + 4 digits, Password: same 4 digits

async function saveDB(){try{await window.storage.set('gems4',JSON.stringify(db),true)}catch(e){}}

let phTimer=null, phIdx=0;

function getPhrases(){return(db.phrases&&db.phrases.length)?db.phrases:DEFAULT_PHRASES;}

function renderPhrases(){
  const stage=$('phraseStage');if(!stage)return;
  const phrases=getPhrases();
  const n=phrases.length;
  const dur=3.2,fade=0.5,total=(dur+fade*2)*n;

  // Build keyframes string
  let kfStyle='';
  for(let i=0;i<n;i++){
    const delay=i*(dur+fade*2);
    const s0=round1(delay/total*100);
    const s1=round1((delay+fade)/total*100);
    const s2=round1((delay+fade+dur)/total*100);
    const s3=Math.min(round1((delay+fade*2+dur)/total*100),99.9);
    kfStyle+=`@keyframes xph${i}{0%,${s0}%{opacity:0;transform:translateY(12px)}${s1}%,${s2}%{opacity:1;transform:translateY(0)}${s3}%,100%{opacity:0;transform:translateY(-12px)}}`;
  }

  // Build phrase divs
  let divs='';
  phrases.forEach((p,i)=>{
    divs+=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;animation:xph${i} ${total.toFixed(1)}s ease-in-out infinite">
      <div style="font-size:28px;font-weight:900;color:#F2B705;font-family:Tajawal,Arial;text-shadow:0 0 20px rgba(242,183,5,.5);letter-spacing:1.5px">${p.ar}</div>
      <div style="font-size:12px;font-weight:900;color:rgba(255,255,255,.75);direction:ltr;letter-spacing:.8px">${p.en}</div>
      <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.4);direction:ltr;letter-spacing:1px;font-style:italic">${p.pron||''}</div>
    </div>`;
  });

  stage.innerHTML=`<style>${kfStyle}</style><div style="position:relative;width:100%;height:90px">${divs}</div>`;
}
function round1(n){return Math.round(n*10)/10;}

async function hbSaveSlot(idx){
  const name=$('hbn')?.value.trim();
  const cat=$('hbc')?.value;
  const note=$('hbnote')?.value.trim();
  if(!name){toast('⚠️ أدخل اسم الطالب');return;}
  if(!hbPendingPhoto){toast('⚠️ أضف صورة الطالب');return;}
  if(!db.honorBoard)db.honorBoard=[];
  // Ensure array has at least idx+1 slots
  while(db.honorBoard.length<=idx) db.honorBoard.push(null);
  db.honorBoard[idx]={name,cat,note,photo:hbPendingPhoto,ts:Date.now()};
  // Remove nulls from end
  while(db.honorBoard.length&&db.honorBoard[db.honorBoard.length-1]===null) db.honorBoard.pop();
  await saveDB();
  hbPendingPhoto=null;
  toast('✅ تم التحديث بنجاح');
  closeM();
  renderHonorBoard();

let hbPendingPhoto=null;
function hbPreviewPhoto(ev){
  const f=ev.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{hbPendingPhoto=e.target.result;$('hbphotoprev').innerHTML=`<img src="${hbPendingPhoto}" style="width:90px;height:90px;border-radius:12px;object-fit:cover;border:2px solid var(--border)"/>`;};
  r.readAsDataURL(f);
}

async function hbSaveEntry(){
  const name=$('hbn')?.value.trim();
  const cat=$('hbc')?.value;
  const note=$('hbnote')?.value.trim();
  if(!name){toast('⚠️ أدخل اسم الطالب');return;}
  if(!hbPendingPhoto){toast('⚠️ أضف صورة الطالب');return;}
  if(!db.honorBoard)db.honorBoard=[];
  db.honorBoard.push({name,cat,note,photo:hbPendingPhoto,ts:Date.now()});
  await saveDB();
  hbPendingPhoto=null;
  toast('✅ تمت الإضافة بنجاح');
  hbManagePanel();
  renderHonorBoard();
}

async function hbDelete(i){
  if(!confirm('حذف هذا الطالب من لوحة الشرف؟'))return;
  db.honorBoard.splice(i,1);
  await saveDB();
  hbManagePanel();
  renderHonorBoard();
}

        <button class="b bp" style="width:100%;justify-content:center;margin-top:10px" onclick="confirmName()">متابعة →</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>$('lv')?.focus(),80);
}
const lErr=m=>{const e=$('lerr');if(e){e.textContent='⚠️ '+m;e.classList.remove('h')}};
function doLogin(){
  const v=$('lv')?.value.trim();
  $('lerr')?.classList.add('h');
  if(loginRole==='admin'){
    if(v===AP){me={role:'admin',name:'الإدارة'};renderAdmin();}
    else lErr('الرمز غير صحيح');
  } else if(loginRole==='supervisor'){
    const p=$('lp')?.value.trim();
    const s=db.supervisors.find(x=>x.username===v&&x.password===p);
    if(s){me={...s,role:'supervisor'};renderSup();}
    else lErr('بيانات الدخول غير صحيحة');
  } else {
    // Support login by username (new) OR legacy STU-code (old)
    const val=v.trim();
    const s=db.students.find(x=>x.username===val||x.code===val.toUpperCase());
    if(!s){lErr('اسم المستخدم غير صالح · Invalid username');return;}
    if(s.name){me={...s,role:'student'};renderStudent();}
    else{pendCode=s.code;$('lf1').classList.add('h');$('lf2').classList.remove('h');setTimeout(()=>$('nv')?.focus(),80);}
  }
}
async function confirmName(){
  const name=$('nv')?.value.trim();if(!name)return;
  db.students=db.students.map(s=>s.code===pendCode?{...s,name}:s);
  await saveDB();me={...db.students.find(s=>s.code===pendCode),role:'student'};renderStudent();
}

function adminLoadUnitImg(i){
  const inp=document.getElementById('uimg'+i);if(!inp)return;

  img.onload=function(){

    catch(e){window['_adminUnitImg'+i]=url;showAdminUnitImgPrev(i,url);}

  const el=$('sm2');el.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><button class="b bs bsm" onclick="sSelGr('${supGr}')">← رجوع</button><div><div class="ar" style="font-size:18px">${s?.nameAr} — ${g?.name} — ${t}</div></div></div>
  ${!allU.length?`<div style="text-align:center;padding:48px;background:#fff;border:2px dashed var(--border);border-radius:20px"><div style="font-size:48px;margin-bottom:12px">📭</div><div class="ar">لا توجد وحدات معتمدة لهذا الفصل</div></div>`:
  `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px">${allU.map(u=>{const f=Object.keys(u.activities||{}).filter(k=>u.activities[k]?.goal).length;return`<div class="uc ${f>0?'done':''}" onclick="sOpenUnit('${u.id}','${u.planId}')"><div style="font-size:28px;margin-bottom:10px">${u.type==='إثرائي'?'✨':'📚'}</div><div class="ar" style="font-size:14px">${u.nameAr}</div><div class="en" style="font-size:11px;margin-bottom:6px">${u.nameEn}</div><div style="font-size:11px;color:${f>0?'#166534':'#999'};font-weight:700">${f}/16 أنشطة</div><div class="pb"><div class="pf" style="width:${Math.round(f/16*100)}%"></div></div></div>`;}).join('')}</div>`}`;
}

function sOpenUnit(uId,pId){
  supUid=uId;supPid=pId;
  const plan=db.unitPlans.find(p=>p.id===pId);
  const unit=plan?.units?.find(u=>u.id===uId);
  if(!unit)return;
  const s=db.subjects.find(x=>x.id===supSub),g=db.grades.find(x=>x.id===supGr);
  const el=$('sm2');if(!el)return;

  // Determine if current supervisor can edit activities
  const editorId=unit.editorId||'';
  const canEdit=!editorId||editorId===me.id;

  // Build activity rows as DOM (avoids all template literal nesting issues)
  let actRows='';
  for(let i=0;i<16;i++){
    const n=i+1;
    const act=AM[n];
    const sv=(unit.activities||{})[n];
    const done=!!(sv&&sv.goal);

    let viewBtn='';
    if(done){
      viewBtn='<button data-act="view" data-n="'+n+'" style="padding:5px 9px;background:var(--lb);color:var(--blue);border:1.5px solid var(--border);border-radius:8px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit">📄 عرض</button>';
    }
    let editBtn='';
    if(canEdit&&done){
      editBtn='<button data-act="edit" data-n="'+n+'" style="padding:5px 9px;background:#fff;color:var(--blue);border:1.5px solid var(--border);border-radius:8px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit">✏️ تعديل</button>'
             +'<button data-act="dup" data-n="'+n+'" style="padding:5px 9px;background:#fff8e1;color:#92660a;border:1.5px solid #fcd34d;border-radius:8px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit">🔁 تكرار</button>';
    }
    let arrowBtn='';
    if(canEdit&&!done){
      arrowBtn='<button data-act="add" data-n="'+n+'" style="background:none;border:none;color:var(--blue);font-size:18px;cursor:pointer;padding:4px 8px">→</button>';
    }
    if(!canEdit&&!done){
      arrowBtn='<span style="font-size:10px;color:#ccc;padding:4px 6px">👁️</span>';
    }

    const goalTxt=done?'<div style="font-size:11px;color:#166534;font-weight:700;margin-top:2px">✅ '+sv.goal+'</div>':'';
    const viewOnlyNote=(!canEdit&&!done)?'<div style="font-size:10px;color:#bbb;margin-top:2px">معاينة فقط · View only</div>':'';

    // The whole row is clickable to add content (when empty & editable).
    const rowClickAttr=(canEdit&&!done)?(' data-act="add" data-n="'+n+'"'):'';
    const rowCursor=(canEdit&&!done)?'pointer':'default';

    actRows+='<div class="ai '+(done?'done':'')+'" style="cursor:'+rowCursor+';"'+rowClickAttr+'>'
      +'<div class="an '+(done?'done':'')+'" style="cursor:'+rowCursor+';">'+n+'</div>'
      +'<div style="font-size:22px;flex-shrink:0;">'+act.ic+'</div>'
      +'<div style="flex:1;">'
        +'<div class="ar" style="font-size:14px;">'+act.ar+'</div>'
        +'<div class="en" style="font-size:11px;">'+act.en+'</div>'
        +goalTxt+viewOnlyNote
      +'</div>'
      +'<div style="display:flex;gap:4px;" data-stop="1">'+viewBtn+editBtn+arrowBtn+'</div>'
      +'</div>';

    // ── Continuation sub-rows ("تكملة 1", "تكملة 2" ...) ──
    const reps=(sv&&sv.reps)||[];
    reps.forEach(function(rep,ri){
      const rDone=!!(rep&&rep.goal);
      let rViewBtn=rDone?('<button data-act="viewrep" data-n="'+n+'" data-ri="'+ri+'" style="padding:4px 8px;background:var(--lb);color:var(--blue);border:1.5px solid var(--border);border-radius:8px;font-size:10px;font-weight:900;cursor:pointer;font-family:inherit">📄 عرض</button>'):'';
      let rEditBtn=(canEdit&&rDone)?('<button data-act="editrep" data-n="'+n+'" data-ri="'+ri+'" style="padding:4px 8px;background:#fff;color:var(--blue);border:1.5px solid var(--border);border-radius:8px;font-size:10px;font-weight:900;cursor:pointer;font-family:inherit">✏️ تعديل</button>'):'';
      let rDelBtn=canEdit?('<button data-act="delrep" data-n="'+n+'" data-ri="'+ri+'" style="padding:4px 8px;background:var(--lr);color:var(--red);border:1.5px solid #fca5a5;border-radius:8px;font-size:10px;font-weight:900;cursor:pointer;font-family:inherit">🗑</button>'):'';
      const rClickAttr=(canEdit&&!rDone)?(' data-act="editrep" data-n="'+n+'" data-ri="'+ri+'"'):'';
      actRows+='<div class="ai '+(rDone?'done':'')+'" style="cursor:'+(canEdit&&!rDone?'pointer':'default')+';margin-right:26px;background:#fbfbfd;border-style:dashed;"'+rClickAttr+'>'
        +'<div class="an" style="background:linear-gradient(135deg,#F2B705,#C9963A);font-size:11px;">'+(ri+1)+'</div>'
        +'<div style="font-size:16px;flex-shrink:0;">🔁</div>'
        +'<div style="flex:1;">'
          +'<div class="ar" style="font-size:12px;">تكملة '+(ri+1)+' للنشاط '+n+' ('+act.ar+')</div>'
          +'<div class="en" style="font-size:10px;">Continuation '+(ri+1)+' — '+act.en+'</div>'
          +(rDone?'<div style="font-size:10px;color:#166534;font-weight:700;margin-top:2px">✅ '+rep.goal+'</div>':'<div style="font-size:10px;color:#bbb">أدخل المحتوى · Add content</div>')
        +'</div>'
        +'<div style="display:flex;gap:4px;" data-stop="1">'+rViewBtn+rEditBtn+rDelBtn+'</div>'
        +'</div>';
    });
  }

  const backAction=sharedMode?("sSharedSelTerm('"+supTerm+"')"):("sSelTerm('"+supTerm+"')");
  const isSharedView=sharedMode&&!canEdit;
  el.innerHTML='<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">'
    +'<button class="b bs bsm" onclick="'+backAction+'">← رجوع</button>'
    +'<div style="flex:1;">'
      +'<div class="ar" style="font-size:17px;">'+unit.nameAr+' '+(unit.type==='إثرائي'?'✨':'📚')+'</div>'
      +'<div class="en" style="font-size:11px;">'+unit.nameEn+' — '+(s?s.nameAr:'')+'  — '+(g?g.name:'')+' — '+supTerm+'</div>'
    +'</div>'
    +(isSharedView?'<span style="background:#f0fdf4;color:#166534;border:1.5px solid #86efac;border-radius:99px;padding:5px 14px;font-size:11px;font-weight:900">🤝 مشتركة معك · Shared with you</span>':'')
    +(canEdit?'<button class="b bs bsm" onclick="openFirstAct(\''+uId+'\',\''+pId+'\')" style="background:var(--lb);">📄 عرض نشاط</button>':'')
    +'<button class="b bp bsm" onclick="prevUnit(\''+uId+'\',\''+pId+'\')">👁️ معاينة كاملة</button>'
    +(canEdit?'<button class="b bs bsm" onclick="shareUnitModal(\''+uId+'\',\''+pId+'\')" style="background:#f0fdf4;color:#166534;border-color:#86efac;">🤝 مشاركة</button>':'')
    +'<button class="b bg bsm" onclick="window.print()">🖨️ طباعة</button>'
    +'</div>'
    +'<div class="ins">'
      +(canEdit?'<div class="ar">اضغط على أي نشاط لإدراج محتواه — اضغط 📄 لعرض النشاط منفرداً — 🔁 لتكرار النشاط بمحتوى مختلف</div><div class="en">Click activity to add content — 📄 to view single activity — 🔁 to add a continuation with different content</div>'
               :'<div class="ar">👁️ معاينة وتدريس فقط — يمكنك استخدام هذه الوحدة مع طلابك، لكن تعديل الأنشطة محصور بمحرر الوحدة</div><div class="en">View & teach only — activity editing is restricted to the unit editor</div>')
    +'</div>'
    +actRows;

  // Attach click handlers via event delegation (fresh listener each render — old node is discarded)
  el.addEventListener('click', function handler(e){
    const stopArea=e.target.closest('[data-stop]');
    const btn=(stopArea?e.target.closest('button[data-act]'):e.target.closest('[data-act]'));
    if(!btn)return;
    const act=btn.getAttribute('data-act');
    const n=parseInt(btn.getAttribute('data-n'));
    const riAttr=btn.getAttribute('data-ri');
    const ri=riAttr!==null?parseInt(riAttr):null;
    if(!n)return;
    if(act==='view') renderActWP(n, db.unitPlans.find(p=>p.id===pId)?.units?.find(u=>u.id===uId), db.unitPlans.find(p=>p.id===pId));
    else if(act==='edit') sOpenAct(n,uId,pId);
    else if(act==='dup') dupAct(n,uId,pId);
    else if(act==='add') sOpenAct(n,uId,pId);
    else if(act==='editrep') sOpenAct(n,uId,pId,ri);
    else if(act==='viewrep') renderActWPRep(n,ri, db.unitPlans.find(p=>p.id===pId)?.units?.find(u=>u.id===uId), db.unitPlans.find(p=>p.id===pId));
    else if(act==='delrep') deleteRep(n,uId,pId,ri);
  });
}


function sOpenAct(n,uId,pId,repIndex){
  const plan=db.unitPlans.find(p=>p.id===pId);
  const unit=plan?.units?.find(u=>u.id===uId);if(!unit)return;
  window._editingRepIndex=(typeof repIndex==='number')?repIndex:null;
  const primaryAct=(unit.activities||{})[n]||{};
  const sv=(window._editingRepIndex===null)?primaryAct:((primaryAct.reps||[])[window._editingRepIndex]||{goal:primaryAct.goal,goalEn:primaryAct.goalEn,cefrLevel:primaryAct.cefrLevel});
  const act=AM[n];
  const defGoal=n===1?'يستطيع الطالب التعرف على المفردات الجديدة واستخدامها في جمل بسيطة':(n===2?'يستطيع الطالب اختبار معرفته بالمفردات من خلال تدريبات تفاعلية':'');

  </div>

  <div class="gf">
    <div style="font-size:12px;font-weight:900;color:var(--blue);margin-bottom:2px">🎯 هدف النشاط — سيكون هو المعيار</div>
    <div style="font-size:10px;font-weight:700;color:var(--red);margin-bottom:8px">Activity Goal — will be the standard</div>
    <div style="margin-bottom:8px">
      <div style="font-size:10px;font-weight:700;color:var(--blue);margin-bottom:3px">العربية ← (من اليمين)</div>

      <div style="font-size:10px;font-weight:700;color:var(--red);margin-bottom:3px">English → (left to right)</div>

    </div>
    <div style="margin-top:10px">
      <div style="font-size:10px;font-weight:700;color:var(--blue);margin-bottom:5px">🎯 المستويات المستهدفة — Target CEFR Levels (multi-select)</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button onclick="selActCEFR('ALL',this)" class="cb ${(!sv.cefrLevel||sv.cefrLevel==='ALL')?'act':''}" id="acefr_ALL" style="font-size:11px;width:auto;padding:0 10px">الكل · All</button>
        ${CEFR.map(function(l){return '<button onclick="selActCEFR(\''+l+'\',this)" class="cb '+((sv.cefrLevel||'').split(',').includes(l)?'act':'')+'" id="acefr_'+l+'">'+l+'</button>';}).join('')}

  </div>`);
  setTimeout(function(){

}

        if(w.audio) window['_vocabAudio'+idx2]=w.audio;

      +'<th style="padding:8px 6px;color:#fff;font-weight:900">الكلمة</th>'
      +'<th style="padding:8px 6px;color:#fff;font-weight:900">الصورة &#128279;</th>'

      +'<th style="padding:8px 6px;color:#fff;font-weight:900;width:34px">&#128465;</th>'

      +'<span style="font-size:11px;color:#999">الكلمات: <strong id="vocabCount">'+numW+'</strong></span></div>';
    return out;
  }
  if(n===2){
    // Build list of available Activity-1 sources: primary + each continuation ("تكملة")
    var a1=(unit&&unit.activities&&unit.activities[1])||{};
    var sources=[];
    if(a1.goal){
      var usableCount=(a1.words||[]).filter(function(w){return w.ar&&w.img;}).length;
      sources.push({val:'1:', label:'النشاط الأول (الأساسي) — '+(a1.words||[]).length+' كلمة '+(usableCount>=3?'✅':'⚠️'), labelEn:'Activity 1 (Primary) — '+(a1.words||[]).length+' words', ready:usableCount>=3});
    }
    (a1.reps||[]).forEach(function(rep,ri){
      if(rep&&rep.goal){
        var repUsable=(rep.words||[]).filter(function(w){return w.ar&&w.img;}).length;
        sources.push({val:'1:'+ri, label:'النشاط الأول — تكملة '+(ri+1)+' — '+(rep.words||[]).length+' كلمة '+(repUsable>=3?'✅':'⚠️'), labelEn:'Activity 1 — Continuation '+(ri+1)+' — '+(rep.words||[]).length+' words', ready:repUsable>=3});
      }
    });
    var curRef=d.sourceRef?('1:'+(d.sourceRef.repIndex!==null&&d.sourceRef.repIndex!==undefined?d.sourceRef.repIndex:'')):'';
    var out2='';
    out2+='<div style="background:linear-gradient(135deg,#ebf2ff,#e0f5f0);border:1.5px solid #dde6f5;border-radius:12px;padding:12px 14px;margin-bottom:14px">'
      +'<div style="font-size:13px;font-weight:900;color:#1B3A6B">🎯 اختبر معرفتك بالمفردات — يُبنى تلقائياً من النشاط الأول</div>'
      +'<div style="font-size:11px;font-weight:700;color:#8B1A1A;margin-top:2px">Test Your Vocabulary — auto-built from Activity 1</div>'

      +'</select>'

    out2+='<div id="ex2PreviewArea" style="margin-bottom:14px"></div>';
    out2+='<button onclick="approveEx2()" style="width:100%;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit">✅ اعتماد وتوليد التدريبات الثلاثة · Approve &amp; Generate the 3 Exercises</button>';
    setTimeout(function(){ ex2PreviewSource(); },50);

  if(n===3||n===6){

async function svAct(n,uId,pId){
  if(n===2){ return approveEx2(); }
  const goal=$('ag')?.value.trim();if(!goal){toast('⚠️ أدخل الهدف أولاً');return;}
  const goalEn=$('agEn')?.value.trim()||'';
  const cefrLv=$('aLevel')?.value||'';
  const plan=db.unitPlans.find(p=>p.id===pId);const unit=plan?.units?.find(u=>u.id===uId);if(!unit)return;
  if(!unit.activities)unit.activities={};
  const d={goal:goal,goalEn:goalEn,cefrLevel:cefrLv};
  if(n===1){
    const rows=document.querySelectorAll('#vocabTbl tr');
    d.words=[...rows].map(function(r,i){
      // Prefer live input fields; fall back to approved snapshot if row was modified after approval
      const arEl=document.getElementById('war'+i);
      const enEl=document.getElementById('wen'+i);
      const imgEl=document.getElementById('wimg'+i);
      const snap=window['_rowSnap'+i]||{};
      const ar=(arEl?arEl.value.trim():'')||snap.ar||'';
      const en=(enEl?enEl.value.trim():'')||snap.en||'';
      const imgRaw=(imgEl&&imgEl.value&&imgEl.value!=='[صورة مرفوعة]')?imgEl.value.trim():'';
      const img=imgRaw||(window['_vocabImg'+i]||'')||snap.img||'';
      const audio=(window['_vocabAudio'+i]||'')||snap.audio||'';
      return{ar:ar,en:en,img:img,audio:audio};
    }).filter(function(w){return w.ar;});
  }
  else if(n===3||n===6){d.textAr=$('ata')?.value||'';d.textEn=$('ate')?.value||'';}
  else if(n===8)d.dialogue=$('adl')?.value||'';
  else if(n===10){d.mmCenter=$('amc')?.value||'';for(let i=0;i<8;i++){d['mq'+i]=$('mq'+i)?.value||'';d['mqe'+i]=$('mqe'+i)?.value||'';d['ma'+i]=$('ma'+i)?.value||'';d['mae'+i]=$('mae'+i)?.value||'';}}
  else if(n===13){d.projName=$('apn')?.value||'';d.projInstr=$('api')?.value||'';d.projRubric=$('apr')?.value||'';d.cW=$('cW')?.checked;d.cR=$('cR')?.checked;d.cU=$('cU')?.checked;}
  else if(n===16){d.testActs=[...document.querySelectorAll('input[name="ta"]:checked')].map(i=>parseInt(i.value));d.testTime=parseInt($('att')?.value)||45;}
  else{d.contentAr=$('aca')?.value||'';d.contentEn=$('ace')?.value||'';}
  const repIdx=window._editingRepIndex;
  if(repIdx===null||repIdx===undefined){
    const existingReps=(unit.activities[n]||{}).reps;
    d.reps=existingReps||[];
    unit.activities[n]=d;
  } else {
    if(!unit.activities[n]) unit.activities[n]={goal:d.goal,goalEn:d.goalEn,cefrLevel:d.cefrLevel,reps:[]};
    if(!unit.activities[n].reps) unit.activities[n].reps=[];
    unit.activities[n].reps[repIdx]=d;
  }
  if(n===1) clearVocabTempState();
  window._editingRepIndex=null;
  await saveDB();closeM();toast(repIdx!==null&&repIdx!==undefined?'✅ تم حفظ التكملة · Continuation saved':'✅ تم حفظ النشاط');sOpenUnit(uId,pId);
}

async function upCSV(event,gId){
  const file=event.target.files?.[0];if(!file)return;
  const r=new FileReader();
  r.onload=async function(e){
    const lines=e.target.result.split('\n').filter(l=>l.trim());let added=0;
    lines.forEach((line,i)=>{if(i===0&&(line.toLowerCase().includes('name')||line.includes('اسم')))return;const p=line.split(',').map(x=>x.replace(/"/g,'').trim());const name=p[0],lv=CEFR.includes(p[1]?.toUpperCase())?p[1].toUpperCase():'A1';if(name){const fn2=name.trim().split(/\s+/)[0]||name;const dg2=String(1000+~~(Math.random()*9000));
          db.students.push({id:uid(),name,code:genCode('STU'),username:fn2+dg2,password:dg2,cefrLevel:lv,gId,supId:me.id});added++;}});
    await saveDB();toast(`✅ تم إضافة ${added} طالب`);rStuTbl(gId);event.target.value='';
  };r.readAsText(file,'UTF-8');
}

function loadUnitImgUrl(){
  const inp=$('wuimgurl');if(!inp)return;
  const url=inp.value.trim();if(!url)return;
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){
    try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);const d=c.toDataURL('image/jpeg',.85);window._wizUnitImg=d;showUnitImgPrev(d);}
    catch(e){window._wizUnitImg=url;showUnitImgPrev(url);}
  };
  img.onerror=function(){window._wizUnitImg=url;showUnitImgPrev(url);};
  img.src=url;
}
function loadUnitImgFile(ev){
  const f=ev.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(e){window._wizUnitImg=e.target.result;showUnitImgPrev(e.target.result);};
  r.readAsDataURL(f);
}
function showUnitImgPrev(src){
  const p=$('uimgprev');
  if(p)p.innerHTML='<img src="'+src+'" style="height:60px;border-radius:10px;object-fit:cover;border:1.5px solid var(--border)"/> <span style="font-size:10px;color:#22c55e;font-weight:700">✅ تم التحميل</span>';
  toast('✅ تم تحميل صورة الوحدة');
}

function wizNext0(){

  wiz.sDate=$('wsd')?.value||'';wiz.eDate=$('wed')?.value||'';

  const prev=wiz.units;
  wiz.units=Array.from({length:n},(_,i)=>({
    id:prev[i]?.id||uid(),
    nameAr:($('wua'+i)?.value.trim())||prev[i]?.nameAr||`وحدة ${i+1}`,
    nameEn:($('wue'+i)?.value.trim())||prev[i]?.nameEn||`Unit ${i+1}`,

function wizSaveUnit(){
  const u=wiz.units[wiz.curUnit];if(!u)return;
  u.nameAr=$('wua')?.value.trim()||u.nameAr;
  u.nameEn=$('wue')?.value.trim()||u.nameEn;
  u.type=document.querySelector('input[name="utype"]:checked')?.value||u.type||'وزاري';
  // Save unit image
  const imgUrl=$('wuimgurl')?.value.trim();
  if(window._wizUnitImg) u.img=window._wizUnitImg;
  else if(imgUrl&&imgUrl!=='[صورة مرفوعة]') u.img=imgUrl;
  if(wiz.curUnit<wiz.units.length-1){wiz.curUnit++;wiz.step=1;}
  else{wiz.curUnit=0;wiz.step=2;}
  renderWizStep();
}

    <div style="display:flex;gap:6px">${n>1?`<button class="b bs bsm" onclick="wizSaveActAndOpen(${n},${n-1})">← السابق</button>`:''} ${n<16?`<button class="b bs bsm" onclick="wizSaveActAndOpen(${n},${n+1})">التالي →</button>`:''}</div>

function wizSaveActAndOpen(cur,next){wizSaveAct(cur,false);setTimeout(()=>wizOpenAct(next),0);}

function wizSaveAct(n,close=true){
  const goal=$('ag')?.value.trim();if(!goal&&close){toast('⚠️ أدخل الهدف');return;}
  const u=wiz.units[wiz.curUnit];if(!u)return;
  if(!u.activities)u.activities={};
  const goalEn=$('agEn')?.value.trim()||'';
  const cefrLv=$('aLevel')?.value||'';
  const d={goal:goal||'',goalEn:goalEn,cefrLevel:cefrLv};
  if(n===1){
    const rows=document.querySelectorAll('#vocabTbl tr');
    d.words=[...rows].map(function(r,i){
      // Prefer live input fields; fall back to approved snapshot if row was modified after approval
      const arEl=document.getElementById('war'+i);
      const enEl=document.getElementById('wen'+i);
      const imgEl=document.getElementById('wimg'+i);
      const snap=window['_rowSnap'+i]||{};
      const ar=(arEl?arEl.value.trim():'')||snap.ar||'';
      const en=(enEl?enEl.value.trim():'')||snap.en||'';
      const imgRaw=(imgEl&&imgEl.value&&imgEl.value!=='[صورة مرفوعة]')?imgEl.value.trim():'';
      const img=imgRaw||(window['_vocabImg'+i]||'')||snap.img||'';
      const audio=(window['_vocabAudio'+i]||'')||snap.audio||'';
      return{ar:ar,en:en,img:img,audio:audio};
    }).filter(function(w){return w.ar;});
  }
  else if(n===3||n===6){d.textAr=$('ata')?.value||'';d.textEn=$('ate')?.value||'';}
  else if(n===8)d.dialogue=$('adl')?.value||'';
  else if(n===10){d.mmCenter=$('amc')?.value||'';for(let i=0;i<8;i++){d['mq'+i]=$('mq'+i)?.value||'';d['mqe'+i]=$('mqe'+i)?.value||'';d['ma'+i]=$('ma'+i)?.value||'';d['mae'+i]=$('mae'+i)?.value||'';}}
  else if(n===13){d.projName=$('apn')?.value||'';d.projInstr=$('api')?.value||'';d.projRubric=$('apr')?.value||'';d.cW=$('cW')?.checked;d.cR=$('cR')?.checked;d.cU=$('cU')?.checked;}
  else if(n===16){d.testActs=[...document.querySelectorAll('input[name="ta"]:checked')].map(i=>parseInt(i.value));d.testTime=parseInt($('att')?.value)||45;}
  else{d.contentAr=$('aca')?.value||'';d.contentEn=$('ace')?.value||'';}
  if(goal)u.activities[n]=d;
  if(n===1&&close) clearVocabTempState();
  if(close){closeM();toast('✅ تم حفظ النشاط');renderWizStep();}
}

      ${nextA?`<button class="zbtn" onclick="renderActWP(${nextA},currentWPUnit,currentWPPlan)">التالي →</button>`:''}

      <button class="zbtn" onclick="window.print()" style="background:rgba(255,255,255,.25)">🖨️ طباعة</button>
      <button class="zbtn" onclick="copyActHTML()" style="background:rgba(201,150,58,.4)">📋 نسخ HTML</button>
      <button class="zbtn" onclick="downloadAct(${actNum})" style="background:rgba(13,110,110,.5)">📥 تحميل</button>
      <button class="zbtn" onclick="goBack()">← رجوع</button>
    </div>
  </div>

function dupAct(n,uId,pId,fromRepIndex){
  // Creates a NEW continuation slot ("تكملة N") under activity n — never overwrites existing content.
  const plan=db.unitPlans.find(p=>p.id===pId);
  const unit=plan?.units?.find(u=>u.id===uId);if(!unit)return;
  if(!unit.activities) unit.activities={};
  const primary=unit.activities[n];
  if(!primary||!primary.goal){toast('⚠️ أضف محتوى النشاط الأساسي أولاً · Add the main activity content first');return;}
  if(!primary.reps) primary.reps=[];
  const newIndex=primary.reps.length; // append — always creates a brand-new continuation
  sOpenAct(n,uId,pId,newIndex);
  toast('🔁 تكملة '+(newIndex+1)+' جديدة — أدخل محتوى مختلفاً واحفظ · New continuation — enter different content and save');
}

async function deleteRep(n,uId,pId,repIndex){
  if(!confirm('حذف هذه التكملة نهائياً؟ · Delete this continuation permanently?'))return;
  const plan=db.unitPlans.find(p=>p.id===pId);
  const unit=plan?.units?.find(u=>u.id===uId);if(!unit)return;
  const primary=(unit.activities||{})[n];
  if(!primary||!primary.reps)return;
  primary.reps.splice(repIndex,1);

  sOpenUnit(uId,pId);
}

function openStuUnit(uId,pId){
  const plan=db.unitPlans.find(p=>p.id===pId);
  const unit=plan?.units?.find(u=>u.id===uId);if(!unit)return;
  const acts=unit.activities||{};
  const stuLv=me&&me.cefrLevel?me.cefrLevel:'';
  function levelOk(a){
    var tgt=a.cefrLevel||'ALL';
    if(!stuLv||tgt==='ALL'||tgt==='')return true;
    return tgt.split(',').indexOf(stuLv)>=0;
  }
  const filled=Object.keys(acts).filter(function(k){
    var a=acts[k];
    if(!a||!a.goal)return false;
    return levelOk(a);
  }).map(Number).sort(function(a,b){return a-b;});

  const el=$('stm');if(!el)return;
  let cards='';
  let totalCount=0;
  filled.forEach(function(n){
    const act=AM[n];const sv=acts[n];
    totalCount++;
    cards+='<div class="sac" data-n="'+n+'" data-uid="'+uId+'" data-pid="'+pId+'" '
      +'style="background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;text-align:center">'
      +'<div style="font-size:28px;margin-bottom:8px">'+act.ic+'</div>'
      +'<div style="font-size:13px;font-weight:900;color:var(--blue);margin-bottom:2px">'+act.ar+'</div>'
      +'<div style="font-size:10px;font-weight:700;color:var(--red);direction:ltr;text-align:center">'+act.en+'</div>'
      +(sv&&sv.goal?'<div style="margin-top:6px;font-size:10px;color:#999;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🎯 '+sv.goal+'</div>':'')
      +'</div>';
    // Continuation cards
    (sv.reps||[]).forEach(function(rep,ri){
      if(!rep||!rep.goal||!levelOk(rep))return;
      totalCount++;
      cards+='<div class="sac" data-n="'+n+'" data-ri="'+ri+'" data-uid="'+uId+'" data-pid="'+pId+'" '
        +'style="background:#fffbe8;border:2px dashed #F2B705;border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;text-align:center">'
        +'<div style="font-size:26px;margin-bottom:8px">🔁</div>'
        +'<div style="font-size:12px;font-weight:900;color:#92660a;margin-bottom:2px">تكملة '+(ri+1)+' — '+act.ar+'</div>'
        +'<div style="font-size:10px;font-weight:700;color:#b08a2a;direction:ltr;text-align:center">Continuation '+(ri+1)+' — '+act.en+'</div>'

function stuOpenAct(n,uId,pId){

function selActCEFR(l,btn){
  if(l==='ALL'){
    // toggle all
    var allActive=CEFR.every(function(x){var b=document.getElementById('acefr_'+x);return b&&b.classList.contains('act');});
    CEFR.forEach(function(x){var b=document.getElementById('acefr_'+x);if(b){if(allActive)b.classList.remove('act');else b.classList.add('act');}});

// Capture the CURRENT (unsaved) state of the vocab table into a draft,
// so that opening the recorder (which replaces the modal) doesn't lose it.
function captureVocabDraft(){
  var tbl=document.getElementById('vocabTbl');
  if(!tbl)return null;
  var draft=[];
  for(var i=0;i<tbl.rows.length;i++){
    var arEl=document.getElementById('war'+i);
    var enEl=document.getElementById('wen'+i);
    var imgEl=document.getElementById('wimg'+i);
    draft.push({
      ar: arEl?arEl.value:'',
      en: enEl?enEl.value:'',
      img: imgEl?imgEl.value:'',
      audio: window['_vocabAudio'+i]||''
    });
  }
  window._vocabDraft=draft;
  return draft;
}

function clearVocabTempState(){
  Object.keys(window).forEach(function(k){
    if(/^_vocab(Img|Audio)\d+$/.test(k)||/^_rowSnap\d+$/.test(k)) delete window[k];
  });
  window._vocabDraft=null;
}

function refreshAudioCell(i){
  var cell=document.getElementById('acell'+i);
  if(cell) cell.innerHTML=buildAudioCellHTML(i);
}
function playCellAudio(i){
  var src=window['_vocabAudio'+i];
  if(src) new Audio(src).play();
}
function reRecordSlot(i){
  if(!confirm('حذف التسجيل الحالي وبدء تسجيل جديد؟ · Delete current recording and re-record?'))return;
  window['_vocabAudio'+i]='';
  refreshAudioCell(i);
  openRecorder(i, window._currentActCtx);
}

function stopRecAndClose(){
  if(recMediaRecorder&&recMediaRecorder.state!=='inactive') recMediaRecorder.stop();
  if(recStream) recStream.getTracks().forEach(t=>t.stop());
  recStream=null; recMediaRecorder=null;
  closeM();
}

let recTimerInterval=null;
function toggleRec(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recStream=stream;
    recChunks=[];
    recMediaRecorder=new MediaRecorder(stream);
    recMediaRecorder.ondataavailable=function(e){if(e.data.size>0) recChunks.push(e.data);};
    recMediaRecorder.onstop=function(){
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(recChunks,{type:'audio/webm'});
      const url=URL.createObjectURL(blob);
      const prev=$('recPreviewAudio'); if(prev) prev.src=url;
      const wrap=$('recPreviewWrap'); if(wrap) wrap.style.display='block';
      const acts=$('recActions'); if(acts) acts.style.display='flex';
      const lbl=$('recLabel'); if(lbl){lbl.textContent='التسجيل جاهز للمعاينة · Recording ready';lbl.style.color='#22c55e';}
      const icon=$('recIcon'); if(icon) icon.textContent='✅';
      clearInterval(recTimerInterval);
      window['_recBlob'+recSlotIdx]=blob;
    };
    recMediaRecorder.start();
    // UI
    const btn=$('recBtn'); if(btn) btn.style.display='none';
    const stop=$('recStopBtn'); if(stop) stop.style.display='';
    const icon=$('recIcon'); if(icon){icon.textContent='🔴';icon.style.animation='pulseRing 1s infinite';}
    const lbl=$('recLabel'); if(lbl){lbl.textContent='جاري التسجيل... · Recording...';lbl.style.color='var(--red)';}
    let secs=0;
    recTimerInterval=setInterval(function(){
      secs++;
      const t=$('recTimer');
      if(t) t.textContent=Math.floor(secs/60)+':'+(secs%60<10?'0':'')+secs%60;
    },1000);
  }).catch(function(e){toast('⚠️ لا يمكن الوصول للميكروفون · Microphone access denied');});
}

function stopRec(){
  if(recMediaRecorder&&recMediaRecorder.state==='recording') recMediaRecorder.stop();
  const btn=$('recBtn'); if(btn) btn.style.display='';
  const stop=$('recStopBtn'); if(stop) stop.style.display='none';
  clearInterval(recTimerInterval);
}

function reRecord(){
  recChunks=[];
  const wrap=$('recPreviewWrap'); if(wrap) wrap.style.display='none';
  const acts=$('recActions'); if(acts) acts.style.display='none';
  const icon=$('recIcon'); if(icon){icon.textContent='🎙️';icon.style.animation='';}
  const lbl=$('recLabel'); if(lbl){lbl.textContent='اضغط للتسجيل · Press to record';lbl.style.color='var(--blue)';}
  const t=$('recTimer'); if(t) t.textContent='';
}

async function approveRec(slotIdx){
  const blob=window['_recBlob'+slotIdx];
  if(!blob){toast('⚠️ لا يوجد تسجيل');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    // 1. Save audio data
    window['_vocabAudio'+slotIdx]=e.target.result;
    delete window['_recBlob'+slotIdx];

    // 2. Auto-save this row's card data (ar, en, img) so nothing is lost when modal reopens
    const arEl=document.getElementById('war'+slotIdx);
    const enEl=document.getElementById('wen'+slotIdx);
    const imgEl=document.getElementById('wimg'+slotIdx);
    window['_rowSnap'+slotIdx]={
      ar: arEl?arEl.value.trim():'',
      en: enEl?enEl.value.trim():'',
      img: (imgEl&&imgEl.value&&imgEl.value!=='[صورة مرفوعة]')?imgEl.value.trim():(window['_vocabImg'+slotIdx]||''),
      audio: e.target.result
    };

    // 3. Refresh this row's audio cell to show Listen + Delete&Re-record buttons
    refreshAudioCell(slotIdx);

    toast('✅ تم اعتماد التسجيل وحفظ بيانات الكارت · Card saved');
    closeM();
    // Re-open the vocab activity modal — mark as "resuming" so unsaved edits (draft) are restored
    window._resumingVocab=true;
    if(window._currentActCtx){
      var ctx=window._currentActCtx;
      if(ctx.type==='sup') sOpenAct(ctx.n,ctx.uId,ctx.pId);
      else if(ctx.type==='wiz') wizOpenAct(ctx.n);
    }
  };
  reader.readAsDataURL(blob);
}

function deleteRecording(slotIdx){
  window['_vocabAudio'+slotIdx]='';
  toast('🗑 تم حذف التسجيل · Recording deleted');
  openRecorder(slotIdx);
}

function resolveEx2Source(unit,sourceRefStr){
  // sourceRefStr like "1:" (primary) or "1:2" (continuation index 2)
  var a1=(unit&&unit.activities&&unit.activities[1])||{};
  if(!sourceRefStr) return {words:(a1.words||[]), repIndex:null};
  var parts=sourceRefStr.split(':');
  var riStr=parts[1];
  if(riStr===undefined||riStr==='') return {words:(a1.words||[]), repIndex:null};
  var ri=parseInt(riStr);
  var rep=(a1.reps||[])[ri];
  return {words:(rep&&rep.words)||[], repIndex:ri};
}

function ex2PreviewSource(){
  const sel=document.getElementById('ex2SourceSel');
  const area=document.getElementById('ex2PreviewArea');
  if(!sel||!area)return;
  const ctx=window._currentActCtx;
  const plan=db.unitPlans.find(function(p){return p.id===ctx.pId;});
  const unit=plan&&plan.units.find(function(u){return u.id===ctx.uId;});
  if(!unit)return;
  const src=resolveEx2Source(unit,sel.value);

    +'<div style="text-align:center"><div style="font-size:22px;font-weight:900;color:'+(usable.length>=3?'#22c55e':'#ef4444')+'">'+(usable.length>=3?'✅':'⚠️')+'</div><div style="font-size:10px;color:#999">'+(usable.length>=3?'جاهز للتوليد · Ready':'يحتاج 3 على الأقل · Needs 3+')+'</div></div>'

}

async function approveEx2(){
  const sel=document.getElementById('ex2SourceSel');
  if(!sel){toast('⚠️ لا يوجد مصدر متاح');return;}
  const goal=$('ag')?.value.trim();
  if(!goal){toast('⚠️ أدخل هدف النشاط أولاً · Enter the activity goal first');return;}
  const goalEn=$('agEn')?.value.trim()||'';
  const cefrLv=$('aLevel')?.value||'ALL';
  const ctx=window._currentActCtx;
  const plan=db.unitPlans.find(function(p){return p.id===ctx.pId;});
  const unit=plan&&plan.units.find(function(u){return u.id===ctx.uId;});
  if(!unit)return;
  const src=resolveEx2Source(unit,sel.value);
  const usable=src.words.filter(function(w){return w.ar&&w.img;});
  if(usable.length<3){toast('⚠️ المصدر المختار لا يحتوي على 3 كلمات كافية');return;}

  const d={goal:goal,goalEn:goalEn,cefrLevel:cefrLv,sourceRef:{n:1,repIndex:src.repIndex},approved:true};
  if(!unit.activities)unit.activities={};
  const repIdx=window._editingRepIndex;
  if(repIdx===null||repIdx===undefined){
    const existingReps=(unit.activities[2]||{}).reps;
    d.reps=existingReps||[];
    unit.activities[2]=d;
  } else {
    if(!unit.activities[2]) unit.activities[2]={goal:d.goal,goalEn:d.goalEn,cefrLevel:d.cefrLevel,reps:[]};
    if(!unit.activities[2].reps) unit.activities[2].reps=[];
    unit.activities[2].reps[repIdx]=d;
  }
  window._editingRepIndex=null;
  await saveDB();
  closeM();
  toast('✅ تم اعتماد النشاط الثاني وتوليد التدريبات الثلاثة! · Activity 2 approved — 3 exercises generated!');
  sOpenUnit(ctx.uId,ctx.pId);
}

function shuffleArr(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

// SHARED DRAG-TO-CONNECT LINE SYSTEM (real line from right column to left column)
// Used by Exercise 1 (word→image) and Exercise 2 (audio→image)
// ═══════════════════════════════════════════════════════
function connDragStart(ev,exKey,exType,idx){
  window['_connDragFrom_'+exKey+'_'+exType]=idx;
  try{ev.dataTransfer.setData('text/plain',String(idx));ev.dataTransfer.effectAllowed='move';}catch(e){}
}
function connDragOverCol(ev,exKey,exType){
  ev.preventDefault();
  const fromIdx=window['_connDragFrom_'+exKey+'_'+exType];
  if(fromIdx===undefined||fromIdx===null)return;
  const wrap=document.getElementById('connWrap_'+exKey+'_'+exType);
  const svg=document.getElementById('connSvg_'+exKey+'_'+exType);
  const rEl=document.getElementById('connR_'+exKey+'_'+exType+'_'+fromIdx);
  if(!wrap||!svg||!rEl)return;
  const wrapRect=wrap.getBoundingClientRect();
  const rRect=rEl.getBoundingClientRect();
  const x1=rRect.left-wrapRect.left, y1=rRect.top-wrapRect.top+rRect.height/2;
  const x2=ev.clientX-wrapRect.left, y2=ev.clientY-wrapRect.top;
  let temp=document.getElementById('connTemp_'+exKey+'_'+exType);
  if(!temp){
    temp=document.createElementNS('http://www.w3.org/2000/svg','line');
    temp.id='connTemp_'+exKey+'_'+exType;
    temp.setAttribute('stroke','#94a3b8');
    temp.setAttribute('stroke-width','2.5');
    temp.setAttribute('stroke-dasharray','5 4');
    temp.setAttribute('stroke-linecap','round');
    svg.appendChild(temp);
  }
  temp.setAttribute('x1',x1);temp.setAttribute('y1',y1);
  temp.setAttribute('x2',x2);temp.setAttribute('y2',y2);
}
function connDropOnCol(ev,exKey,exType,connectFn){
  ev.preventDefault();
  const fromIdx=window['_connDragFrom_'+exKey+'_'+exType];
  const temp=document.getElementById('connTemp_'+exKey+'_'+exType);
  if(temp)temp.remove();
  if(fromIdx===undefined||fromIdx===null)return;
  const target=ev.target.closest('.conn-left-item');
  if(!target)return;
  const toIdx=parseInt(target.getAttribute('data-idx'));
  connectFn(fromIdx,toIdx);
  window['_connDragFrom_'+exKey+'_'+exType]=null;
}
function connDragEnd(exKey,exType){
  const temp=document.getElementById('connTemp_'+exKey+'_'+exType);
  if(temp)temp.remove();
  window['_connDragFrom_'+exKey+'_'+exType]=null;
}
// Draws permanent lines for all current connections, from the word/audio's LEFT edge
// to the image's RIGHT edge (the sides that face each other across the two RTL columns).
function drawConnLines(exKey,exType,conn,colorFn){
  const wrap=document.getElementById('connWrap_'+exKey+'_'+exType);
  const svg=document.getElementById('connSvg_'+exKey+'_'+exType);
  if(!wrap||!svg)return;
  const wrapRect=wrap.getBoundingClientRect();
  let html='';
  Object.keys(conn).forEach(function(ri){
    const li=conn[ri];
    const rEl=document.getElementById('connR_'+exKey+'_'+exType+'_'+ri);
    const lEl=document.getElementById('connL_'+exKey+'_'+exType+'_'+li);
    if(!rEl||!lEl)return;
    const rRect=rEl.getBoundingClientRect();
    const lRect=lEl.getBoundingClientRect();
    const x1=rRect.left-wrapRect.left, y1=rRect.top-wrapRect.top+rRect.height/2;
    const x2=lRect.right-wrapRect.left, y2=lRect.top-wrapRect.top+lRect.height/2;
    const color=colorFn(parseInt(ri),parseInt(li));
    html+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="3" stroke-linecap="round" opacity=".85"/>';
    html+='<circle cx="'+x1+'" cy="'+y1+'" r="4.5" fill="'+color+'"/>';
    html+='<circle cx="'+x2+'" cy="'+y2+'" r="4.5" fill="'+color+'"/>';
  });
  svg.innerHTML=html;
}

function ex1Connect(key,fromWordIdx,toImgIdx){
  const conn=window['_ex1_conn_'+key]||{};
  const connImg=window['_ex1_connImg_'+key]||{};
  const prevImgForWord=conn[fromWordIdx];
  if(prevImgForWord!==undefined)delete connImg[prevImgForWord];
  const prevWordForImg=connImg[toImgIdx];
  if(prevWordForImg!==undefined)delete conn[prevWordForImg];
  conn[fromWordIdx]=toImgIdx;
  connImg[toImgIdx]=fromWordIdx;
  window['_ex1_conn_'+key]=conn;
  window['_ex1_connImg_'+key]=connImg;
  renderEx1(key);
}

function ex1Pick(key,kind,idx){
  const sel=window['_ex1_sel_'+key]||{word:null,img:null};
  const conn=window['_ex1_conn_'+key]||{};
  const connImg=window['_ex1_connImg_'+key]||{};
  if(kind==='word'){
    // toggle selection; if this word already connected, clicking it lets you reconnect
    sel.word=idx;
  } else {
    sel.img=idx;
  }
  window['_ex1_sel_'+key]=sel;
  if(sel.word!==null&&sel.img!==null){
    // Remove any previous connection involving either side (allows re-pairing)
    const prevImgForWord=conn[sel.word];
    if(prevImgForWord!==undefined) delete connImg[prevImgForWord];
    const prevWordForImg=connImg[sel.img];
    if(prevWordForImg!==undefined) delete conn[prevWordForImg];
    conn[sel.word]=sel.img;
    connImg[sel.img]=sel.word;
    window['_ex1_conn_'+key]=conn;
    window['_ex1_connImg_'+key]=connImg;
    window['_ex1_sel_'+key]={word:null,img:null};
  }
  renderEx1(key);
}
async function submitEx1(key){
  const wordsArr=window['_ex1_words_'+key]||[];
  const conn=window['_ex1_conn_'+key]||{};
  const imgsArr=window['_ex1_imgs_'+key]||[];
  let correct=0;
  Object.keys(conn).forEach(function(wi){
    if(wordsArr[wi].ar===imgsArr[conn[wi]].ar) correct++;
  });
  window['_ex1_score_'+key]=correct;
  window['_ex1_submitted_'+key]=true;
  for(let i=0;i<correct;i++) awardTrophyCoin('act'+key);
  renderTrophyBar('act'+key,wordsArr.length);
  renderEx1(key);
}

function initEx3(key){
  const words=window['_ex_src_'+key]||[];
  const n=Math.min(words.length,5);
  const chosen=shuffleArr(words).slice(0,n);
  window['_ex3_targets_'+key]=chosen;
  window['_ex3_pool_'+key]=shuffleArr(chosen);
  window['_ex3_placed_'+key]={};
  window['_ex3_selWord_'+key]=null;
  window['_ex3_score_'+key]=0;
  renderEx3(key);
}
function renderEx3(key){
  const area=document.getElementById('ex3_area_'+key);if(!area)return;
  const targets=window['_ex3_targets_'+key]||[];
  const pool=window['_ex3_pool_'+key]||[];
  const placed=window['_ex3_placed_'+key]||{};
  const selWord=window['_ex3_selWord_'+key];

  // ── TOP: word pool box (drag/tap source) ──
  let h='<div style="background:var(--lb);border:2px solid var(--border);border-radius:12px;padding:12px;margin-bottom:16px">';
  h+='<div style="font-size:11px;font-weight:900;color:var(--blue);text-align:center;margin-bottom:8px">اسحب أو اضغط على الكلمة ثم على الصورة الصحيحة · Drag or tap a word, then tap the correct picture</div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px">';
  var anyLeft=false;
  pool.forEach(function(w,wi){
    const isUsed=Object.values(placed).some(function(p){return p===w;});
    if(isUsed)return;
    anyLeft=true;
    const isSel=selWord===wi;
    h+='<div class="ex-item '+(isSel?'sel':'')+'" draggable="true" ondragstart="ex3DragStart(event,\''+key+'\','+wi+')" onclick="ex3SelectWord(\''+key+'\','+wi+')" style="padding:10px 16px;font-weight:900;color:var(--blue);font-size:14px;cursor:grab;background:#fff">'+w.ar+'</div>';
  });
  if(!anyLeft) h+='<div style="font-size:11px;color:#999;padding:8px">✅ تم استخدام كل الكلمات · All words placed</div>';
  h+='</div></div>';

  // ── BELOW: image drop-zones ──
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px">';
  targets.forEach(function(t,ti){
    const placedWord=placed[ti];
    h+='<div style="text-align:center">'
      +'<img src="'+t.img+'" style="width:100%;height:70px;object-fit:cover;border-radius:10px;margin-bottom:6px"/>'
      +'<div onclick="ex3Drop(\''+key+'\','+ti+')" style="min-height:38px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;cursor:pointer;background:'+(placedWord?(placedWord.ar===t.ar?'#f0fdf4':'#fef2f2'):'#f8fafc')+';color:'+(placedWord?(placedWord.ar===t.ar?'#166534':'#991b1b'):'#999')+'">'+(placedWord?placedWord.ar:'ضع هنا · Drop here')+'</div>'
      +'</div>';
  });
  h+='</div>';

  const allPlaced=Object.keys(placed).length>=targets.length;
  if(allPlaced){
    h+='<div id="ex3_finish_'+key+'"></div>';
  }
  area.innerHTML=h;
  if(allPlaced){
    const correct=targets.filter(function(t,ti){return placed[ti]&&placed[ti].ar===t.ar;}).length;
    showExFinishButton(key,3,correct,targets.length,'ex3_finish_'+key,function(){initEx3(key);});
  }

  // Wire up drop-zone dragover/drop events (native HTML5 DnD, complements the tap-to-place above)
  area.querySelectorAll('[onclick^="ex3Drop"]').forEach(function(zone,zi){
    zone.addEventListener('dragover',function(e){e.preventDefault();});
    zone.addEventListener('drop',function(e){
      e.preventDefault();
      const wi=window._ex3DragWi;
      if(wi!==undefined&&wi!==null){ ex3PlaceWord(key,zi,wi); }
    });
  });
}
function ex3DragStart(ev,key,wi){ window._ex3DragWi=wi; }
function ex3SelectWord(key,wi){

}
function ex3Drop(key,targetIdx){

  ex3PlaceWord(key,targetIdx,wi);

function ex3PlaceWord(key,targetIdx,wi){
  const pool=window['_ex3_pool_'+key]||[];
  const targets=window['_ex3_targets_'+key]||[];
  const placed=window['_ex3_placed_'+key]||{};

function vocabLoadUrl(i){
  const inp=document.getElementById('wimg'+i);
  if(!inp)return;
  const url=inp.value.trim();
  if(!url||url==='[صورة مرفوعة]'){toast('⚠️ أدخل رابط الصورة أولاً');return;}
  // Test if URL loads by creating an img element
  const testImg=new Image();
  testImg.crossOrigin='anonymous';
  testImg.onload=function(){
    // Convert to base64 via canvas for reliable storage
    try{
      const c=document.createElement('canvas');
      c.width=testImg.naturalWidth;c.height=testImg.naturalHeight;
      const ctx=c.getContext('2d');
      ctx.drawImage(testImg,0,0);
      const data=c.toDataURL('image/jpeg',0.85);
      window['_vocabImg'+i]=data;
      const prev=document.getElementById('wprev'+i);
      if(prev)prev.innerHTML='<img src="'+data+'" style="height:44px;border-radius:8px;object-fit:cover;border:1.5px solid var(--border)"/>'
        +'<span style="font-size:10px;color:#22c55e;font-weight:700;margin-right:4px">✅ تم التحميل</span>';
      inp.value='[صورة مرفوعة]';
      toast('✅ تم تحميل الصورة بنجاح');
    }catch(err){
      // If canvas is blocked (CORS), just use the URL directly
      window['_vocabImg'+i]=url;
      const prev=document.getElementById('wprev'+i);
      if(prev)prev.innerHTML='<img src="'+url+'" style="height:44px;border-radius:8px;object-fit:cover;border:1.5px solid var(--border)" crossorigin="anonymous"/>'
        +'<span style="font-size:10px;color:#22c55e;font-weight:700;margin-right:4px">✅ تم التحميل</span>';
      toast('✅ تم تحميل الصورة');
    }
  };
  testImg.onerror=function(){
    // Try direct URL without CORS
    window['_vocabImg'+i]=url;
    const prev=document.getElementById('wprev'+i);
    if(prev)prev.innerHTML='<img src="'+url+'" style="height:44px;border-radius:8px;object-fit:cover;border:1.5px solid var(--border)"/>'
      +'<span style="font-size:10px;color:#F2B705;font-weight:700;margin-right:4px">⚠️ تم الحفظ (تحقق من الظهور)</span>';
    toast('تم حفظ الرابط - قد لا تظهر الصورة بسبب CORS');
  };
  testImg.src=url;
}
function vocabAudioUpload(ev,i){
  const f=ev.target.files?.[0];if(!f)return;

  r.onload=e=>{window[`_vocabAudio${i}`]=e.target.result;toast('✅ تم رفع التسجيل الصوتي');};

async function awardTrophyCoin(actKey){
  if(!me||me.role!=='student')return;
  const sid=me.id;
  if(!db.trophies)db.trophies={};
  if(!db.trophies[sid])db.trophies[sid]={bronze:0,silver:0,gold:0,champion:false};
  const t=db.trophies[sid];
  t.bronze=(t.bronze||0)+1;
  if(t.bronze>=100){t.silver=(t.silver||0)+1;t.bronze=t.bronze-100;}
  if(t.silver>=10){t.gold=(t.gold||0)+1;t.silver=t.silver-10;}
  if(t.gold>=10&&!t.champion){t.champion=true;toast('🏆 مبروك! حصلت على كأس الأبطال!');}
  await saveDB();
}

  const medal=isG?'🥇':isS?'🥈':'🥉';
  const bg=isG?'linear-gradient(135deg,#fffef5,#fff8e1)':isS?'linear-gradient(135deg,#f8fafc,#f1f5f9)':'linear-gradient(135deg,#fffbf0,#fef3c7)';
  const brd=isG?'#F2B705':isS?'#9ca3af':'#d97706';
  const lbl=isG?'ممتاز جداً — Excellent':isS?'ممتاز — Very Good':'جيد جداً — Good';
  const sub=db.subjects.find(s=>s.id===c.plan.sId);
  const sup=db.supervisors.find(s=>s.id===me.supId);
  return`<div class="certw" style="background:${bg};border-color:${brd}">
    <div style="position:absolute;top:0;left:0;right:0;bottom:0;opacity:.04;background:repeating-linear-gradient(45deg,${brd} 0,${brd} 1px,transparent 0,transparent 50%);background-size:20px 20px;pointer-events:none"></div>
    <div class="certi" style="border-color:${brd}38">
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px">${logo(40,32)}<div style="line-height:1.2;text-align:right"><div class="ar" style="font-size:13px">جيمس الأكاديمية العالمية</div><div class="en" style="font-size:10px">GEMS World Academy — Dubai</div></div></div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px"><div style="height:1px;flex:1;background:${brd}"></div><span style="font-size:14px;color:${brd}">✦</span><div style="height:1px;flex:1;background:${brd}"></div></div>
      <div style="font-size:52px;margin-bottom:4px">${medal}</div>
      <div style="font-size:11px;font-weight:900;color:${brd};letter-spacing:2px;margin-bottom:14px;text-transform:uppercase">${lbl}</div>
      <div style="font-size:13px;font-weight:700;color:#666;margin-bottom:8px">تُقدَّم هذه الشهادة إلى — This certificate is awarded to</div>
      <div class="ar" style="font-size:26px;margin-bottom:4px">${me.name}</div>
      <div style="font-size:11px;color:#666;font-weight:700;margin-bottom:14px">${me.cefrLevel||''} Level</div>
      <div style="font-size:13px;font-weight:700;color:#666;margin-bottom:6px">تقديراً لإتمامه وحدة — For successfully completing</div>
      <div class="ar" style="font-size:18px;margin-bottom:4px">${c.unit.nameAr}</div>
      <div class="en" style="font-size:13px;margin-bottom:12px">${c.unit.nameEn||''}</div>
      <div style="font-size:11px;color:#888;margin-bottom:14px">${sub?.nameAr||''} | ${c.plan.term||''}</div>
      <div style="font-size:52px;font-weight:900;color:${brd};margin-bottom:4px">${sc}%</div>
      <div style="font-size:12px;font-weight:700;color:#666;margin-bottom:18px">النسبة المئوية — Achievement Score</div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:18px"><div style="height:1px;flex:1;background:${brd}"></div><span style="font-size:12px;color:${brd}">✦</span><div style="height:1px;flex:1;background:${brd}"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:end;padding:0 20px">
        <div style="text-align:center"><div style="height:1px;width:100px;background:#999;margin-bottom:4px"></div><div style="font-size:10px;font-weight:700;color:#666">توقيع المشرف — Supervisor</div><div class="ar" style="font-size:11px">${sup?.name||'المشرف'}</div></div>
        <div style="text-align:center">${logo(34,27)}</div>
        <div style="text-align:center"><div style="height:1px;width:100px;background:#999;margin-bottom:4px"></div><div style="font-size:10px;font-weight:700;color:#666">التاريخ — Date</div><div class="ar" style="font-size:11px">${new Date().toLocaleDateString('ar-AE')}</div></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:16px" class="np">
      <button class="b bs bsm" onclick="window.print()">🖨️ طباعة</button>
      <button class="b bg bsm" onclick="toast('📥 تحميل PDF قريباً')">📥 PDF</button>
    </div>
  </div>`;
}
